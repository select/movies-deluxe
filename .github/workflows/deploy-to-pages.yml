name: Deploy to Cloudflare Pages

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract admin database
        run: tar -xzf data/movies-db.tar.gz -C data/

      - name: Generate database
        run: pnpm db:generate

      - name: Generate static site
        run: pnpm build:prod
        env:
          NUXT_PUBLIC_ENABLE_SEMANTIC_SEARCH: 'false'

      - name: Extract posters
        run: pnpm tsx scripts/extract-posters.ts .output/public/posters

      - name: Remove large embeddings files (Cloudflare Pages 25MB limit)
        run: rm -f .output/public/data/embeddings-*.db

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy .output/public --project-name=movies-deluxe
